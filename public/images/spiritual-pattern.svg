<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" opacity="0.05">
  <defs>
    <!-- Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8742A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F4A44A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8742A" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Mandala Definition -->
    <g id="mandala-unit">
      <!-- Outer rings -->
      <circle cx="0" cy="0" r="280" fill="none" stroke="#E8742A" stroke-width="0.75" stroke-dasharray="4 8"/>
      <circle cx="0" cy="0" r="270" fill="none" stroke="#F4A44A" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="240" fill="none" stroke="#E8742A" stroke-width="0.5" stroke-dasharray="1 5"/>
      
      <!-- Petals / Rays -->
      <g>
        <!-- 24 rays -->
        <path d="M 0 0 L 0 -260 M 0 0 L 0 260 M 0 0 L -260 0 M 0 0 L 260 0" stroke="#F4A44A" stroke-width="0.3"/>
        <path d="M 0 0 L -183.8 -183.8 M 0 0 L 183.8 183.8 M 0 0 L -183.8 183.8 M 0 0 L 183.8 -183.8" stroke="#F4A44A" stroke-width="0.3"/>
        <!-- Star shapes -->
        <polygon points="0,-180 30,-50 180,0 30,50 0,180 -30,50 -180,0 -30,-50" fill="none" stroke="url(#saffronGrad)" stroke-width="1"/>
        <polygon points="0,-120 20,-35 120,0 20,35 0,120 -20,35 -120,0 -20,-35" fill="none" stroke="#F4A44A" stroke-width="0.75" transform="rotate(45)"/>
      </g>
      
      <!-- Concentric inner details -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#E8742A" stroke-width="0.75" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#F4A44A" stroke-width="1"/>
      
      <!-- Lotus Flower in center -->
      <g transform="scale(1.2)">
        <!-- Outer petals -->
        <path d="M0,-40 C15,-20 25,-10 0,25 C-25,-10 -15,-20 0,-40 Z" fill="none" stroke="#E8742A" stroke-width="1"/>
        <path d="M0,-40 C30,-15 35,5 0,25 C-35,5 -30,-15 0,-40 Z" fill="none" stroke="#F4A44A" stroke-width="0.75" opacity="0.8"/>
        <!-- Side petals -->
        <path d="M0,0 C25,-25 40,-10 10,20 C-20,50 -10,15 0,0 Z" fill="none" stroke="#E8742A" stroke-width="0.75" transform="rotate(30)"/>
        <path d="M0,0 C-25,-25 -40,-10 -10,20 C20,50 10,15 0,0 Z" fill="none" stroke="#E8742A" stroke-width="0.75" transform="rotate(-30)"/>
        <path d="M0,0 C35,-15 45,10 15,25 C-15,40 -5,15 0,0 Z" fill="none" stroke="#F4A44A" stroke-width="0.5" transform="rotate(60)"/>
        <path d="M0,0 C-35,-15 -45,10 -15,25 C15,40 5,15 0,0 Z" fill="none" stroke="#F4A44A" stroke-width="0.5" transform="rotate(-60)"/>
        <!-- Center bud -->
        <circle cx="0" cy="5" r="8" fill="none" stroke="#E8742A" stroke-width="1"/>
      </g>
    </g>
    
    <!-- Yoga Lotus Pose Outline Definition -->
    <g id="yoga-pose" stroke="#E8742A" stroke-width="1" fill="none">
      <!-- Head / Crown Sahasrara -->
      <circle cx="0" cy="-120" r="16"/>
      <!-- Torso & Spine -->
      <path d="M 0,-104 C 0,-60 5,-50 0,-10 C -5,-10 -5,30 0,40" stroke-width="1.5"/>
      <!-- Hands in Anjali Mudra / lotus pose silhouette -->
      <path d="M -54,-10 C -40,-60 -10,-80 0,-85 C 10,-80 40,-60 54,-10 C 60,10 40,40 0,42 C -40,40 -60,10 -54,-10 Z" stroke-width="1.2"/>
      <path d="M -30,-40 C -15,-65 -5,-80 0,-85 C 5,-80 15,-65 30,-40" stroke-width="0.75"/>
      <!-- Crossed legs (Lotus Pose Padmasana) -->
      <path d="M -70,30 C -80,45 -60,60 -10,50 C 0,48 0,48 10,50 C 60,60 80,45 70,30 C 50,10 20,40 0,42 C -20,40 -50,10 -70,30 Z" stroke-width="1.5"/>
      <!-- Aura radiating from pose -->
      <path d="M -120,-80 C -60,-150 60,-150 120,-80" stroke-width="0.5" stroke-dasharray="3 6"/>
      <path d="M -150,-40 C -80,-120 80,-120 150,-40" stroke-width="0.5" stroke-dasharray="2 4"/>
      <circle cx="0" cy="-120" r="30" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6"/>
    </g>
  </defs>

  <!-- Background Mandala Top Right -->
  <use href="#mandala-unit" x="1200" y="150" transform="scale(1.2)" />
  
  <!-- Yoga Pose Center Left -->
  <use href="#yoga-pose" x="250" y="480" transform="scale(1.3)" />

  <!-- Background Mandala Bottom Right -->
  <use href="#mandala-unit" x="1100" y="700" transform="scale(1.5)" />

  <!-- Smaller Decorative Mandalas & Lotus Flowers -->
  <use href="#mandala-unit" x="100" y="100" transform="scale(0.6)" />
  <use href="#mandala-unit" x="650" y="850" transform="scale(0.8)" opacity="0.7" />
  
  <!-- Subtle floating lotus flowers -->
  <g transform="translate(850, 300) scale(0.6)">
    <use href="#mandala-unit"/>
  </g>
  <g transform="translate(150, 750) scale(0.5)">
    <use href="#mandala-unit"/>
  </g>
</svg>
